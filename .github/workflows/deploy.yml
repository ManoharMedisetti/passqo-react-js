name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm install
          chmod -R +x node_modules/.bin || true

      - name: Switch to HashRouter and fix all image & category paths
        run: |
          # 1. Switch to HashRouter so reloads work on all pages
          sed -i 's/BrowserRouter/HashRouter/g' src/main.jsx
          
          # 2. Prefix all image, icon, and category paths (including template literals) with /passqo-react-js/
          find src -type f \( -name "*.jsx" -o -name "*.js" \) -exec sed -i 's|/passqo-react-js/images/|/images/|g; s|/passqo-react-js/icons/|/icons/|g' {} +
          find src -type f \( -name "*.jsx" -o -name "*.js" \) -exec sed -i 's|/images/|/passqo-react-js/images/|g; s|/icons/|/passqo-react-js/icons/|g' {} +

      - name: Build with base path
        run: npx vite build --base=/passqo-react-js/

      - name: Copy 404 for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
